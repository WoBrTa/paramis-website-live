<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B-52D Radar Navigator Simulator - COL Taylor - 175 Missions</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0a0b0d;overflow:hidden;}
  body{display:flex;justify-content:center;align-items:center;
       background:radial-gradient(1600px 900px at 50% 40%, #14161a 0%, #0a0b0d 70%);}
  svg{width:100vw;height:100vh;display:block;}
  text{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;
       -webkit-user-select:none;user-select:none;}
  .ttl{fill:#e9e7df;letter-spacing:4px;font-size:24px;font-weight:bold;}
  .plq{fill:#e9e7df;letter-spacing:2.5px;font-size:16px;font-weight:bold;}
  .lbl{fill:#e3e1d8;letter-spacing:1px;font-size:15px;font-weight:bold;}
  .sml{fill:#cfcdc4;letter-spacing:.6px;font-size:12px;font-weight:bold;}
  .dig{font-family:"Courier New",Consolas,monospace;font-size:34px;font-weight:bold;fill:#efeee6;}
  .chipv{font-family:"Courier New",Consolas,monospace;font-size:24px;font-weight:bold;fill:#e8f6ee;}
  .etch{fill:#d8d6cc;letter-spacing:1.2px;font-size:13px;font-weight:bold;}
  .hit{cursor:pointer;pointer-events:all;fill:rgba(0,0,0,0);}
  .ann rect.win{fill:#17181a;stroke:#0b0c0d;}
  .ann text{fill:#54544d;letter-spacing:1px;font-size:15px;font-weight:bold;}
  .ann.litA rect.win{fill:#ffb300;filter:drop-shadow(0 0 7px #ffb300);}
  .ann.litA text{fill:#241a02;}
  .ann.litG rect.win{fill:#46ff7e;filter:drop-shadow(0 0 7px #46ff7e);}
  .ann.litG text{fill:#03220f;}
  .ann.litW rect.win{fill:#f2eed6;filter:drop-shadow(0 0 7px #f2eed6);}
  .ann.litW text{fill:#26251f;}
  .ann.litR rect.win{fill:#ff453a;filter:drop-shadow(0 0 7px #ff453a);}
  .ann.litR text{fill:#2b0503;}
  .bcn{animation:bcn 1.1s steps(1) infinite;}
  @keyframes bcn{0%{opacity:1}55%{opacity:.05}100%{opacity:.05}}
  .cue{opacity:0;pointer-events:none;}
  .cue rect.ring{fill:none;stroke:#ffcf4d;stroke-width:4;filter:drop-shadow(0 0 12px #ffcf4d);}
  .cue circle.stepc{fill:#ffcf4d;stroke:#5e4302;stroke-width:2;filter:drop-shadow(0 0 8px #ffcf4d);}
  .cue text{fill:#241a02;font-size:20px;font-weight:bold;}
  .cue.on{opacity:1;animation:cuePulse 1.4s ease-in-out infinite;}
  @keyframes cuePulse{0%,100%{opacity:.30}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){
    .bcn{animation:none;}
    .cue.on{animation:none;opacity:.85;}
  }
</style>
</head>
<body>
<svg id="panel" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img"

<script>
(function(){
  "use strict";
  var svg=document.getElementById('panel');
  var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function G(id){return document.getElementById(id);}
  var SVGNS='http://www.w3.org/2000/svg';

  /* ---------- counters and lamps ---------- */
  function setC(p,v,n){
    var s=String(Math.max(0,Math.floor(v)));
    while(s.length<n)s='0'+s;
    s=s.slice(-n);
    for(var i=0;i<n;i++){G(p+i).textContent=s.charAt(i);}
  }
  var dimC={doors:'#4a3608',rel:'#0c351c'},litC={doors:'#ffb300',rel:'#46ff7e'};
  function L(k,on){
    var e=G(k==='doors'?'lensDoors':'lensRel');
    e.setAttribute('fill',on?litC[k]:dimC[k]);
    e.style.filter=on?'drop-shadow(0 0 7px '+litC[k]+')':'none';
  }
  function A(id,on,cls){G(id).classList.toggle(cls,on);}

  /* ---------- audio (synthesized, default off) ---------- */
  var AC=null,master=null,toneNode=null,volIdx=0;
  function ensureAC(){
    if(AC)return;
    var C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    AC=new C();
    master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
    var dg=AC.createGain();dg.gain.value=0.9;dg.connect(master);
    [56,60.7].forEach(function(f,i){
      var o=AC.createOscillator(),g=AC.createGain();
      o.type='triangle';o.frequency.value=f;g.gain.value=i?0.05:0.06;
      o.connect(g);g.connect(dg);o.start();
    });
    var nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=nb.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    var ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;
    var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=140;bp.Q.value=0.7;
    var ng=AC.createGain();ng.gain.value=0.10;
    ns.connect(bp);bp.connect(ng);ng.connect(dg);ns.start();
  }
  function setVol(i){
    volIdx=i;
    if(i>0){ensureAC();if(AC&&AC.state==='suspended')AC.resume();}
    if(master)master.gain.value=[0,0.35,0.7][i];
  }
  function noiseBurst(dur,g0,fc){
    if(!AC||!volIdx)return;
    var t=AC.currentTime,b=AC.createBuffer(1,Math.max(1,Math.floor(AC.sampleRate*dur)),AC.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    var s=AC.createBufferSource();s.buffer=b;
    var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fc;
    var g=AC.createGain();g.gain.value=g0;
    s.connect(f);f.connect(g);g.connect(master);s.start(t);
  }
  function thump(big){
    if(!AC||!volIdx)return;
    var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.setValueAtTime(big?85:75,t);
    o.frequency.exponentialRampToValueAtTime(38,t+0.16);
    g.gain.setValueAtTime(big?0.5:0.22,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+0.22);
    noiseBurst(0.06,big?0.18:0.08,900);
  }
  function click(){noiseBurst(0.03,0.22,2400);}
  function doorSfx(){noiseBurst(0.5,0.2,500);setTimeout(function(){thump(true);},420);}
  function toneOn(){
    if(!AC||!volIdx||toneNode)return;
    var o=AC.createOscillator(),g=AC.createGain();
    o.frequency.value=1020;g.gain.value=0.07;
    o.connect(g);g.connect(master);o.start();
    toneNode={o:o,g:g};
  }
  function toneOff(){
    if(toneNode){
      toneNode.g.gain.setTargetAtTime(0.0001,AC.currentTime,0.02);
      toneNode.o.stop(AC.currentTime+0.12);
      toneNode=null;
    }
  }

  /* ---------- simulation state ---------- */
  var mode='AUTO', phase='COUNT';
  var TG=42, trun=0, holdT=0, wp=108;
  var doorsOpen=false, guardOpen=false, toneActive=false;
  var intIdx=2;
  var INT_MS=[50,150,250,350,450], INT_ANG=[-70,-35,0,35,70], TICKS=[60,80,105,130,160];
  var bombs=[], fx=[], blossomT=-1;
  var GROUND_Y=410, GRAV=27.5, SPD=110, CLOUD_SPD=160;
  var offT=0, offC=0, spillI=null, tickI=null, mcI=null;

  var terrG=G('terrG'),cloudG=G('cloudG'),fxG=G('fxG'),bombLayer=G('bombLayer');
  var tgtMark=G('tgtMark'),ipMark=G('ipMark'),rngVal=G('rngVal');
  var guardHitEl=G('guardHit'),btnHitEl=G('btnHit');
  var cueDoorsEl=G('cueDoors'),cueRelEl=G('cueRel');

  function setHint(){
    if(mode==='AUTO'){
      G('ckL1').textContent='AUTO SEQUENCE RUNNING';
      G('ckL2').textContent='PRESS A GLOWING CONTROL TO TAKE THE JET';
      G('dot1').setAttribute('visibility','hidden');
      G('dot2').setAttribute('visibility','hidden');
    }else{
      G('ckL1').textContent='1  BOMB DOORS - OPEN';
      G('ckL2').textContent='2  GUARD UP - PRESS RELEASE';
      G('dot1').setAttribute('visibility','visible');
      G('dot2').setAttribute('visibility','visible');
    }
  }
  function dot(id,on){G(id).setAttribute('fill',on?'#46ff7e':'#3a3d33');}

  function updateCues(){
    var armed=(phase==='COUNT'||phase==='HOLD');
    cueDoorsEl.classList.toggle('on',armed&&!doorsOpen);
    cueRelEl.classList.toggle('on',armed&&doorsOpen);
  }

  function doorsSet(open,silent){
    doorsOpen=open;
    G('doorsLever').setAttribute('transform','translate(1626 816) rotate('+(open?0:180)+') scale(1.15)');
    L('doors',open);
    A('annDoors',open,'litA');
    G('bayDoors').setAttribute('visibility',open?'visible':'hidden');
    dot('dot1',open);
    updateCues();
    if(!silent)doorSfx();
  }
  function takeJet(){
    if(mode==='CREW')return;
    mode='CREW';
    A('annAuto',false,'litW');
    A('annCrew',true,'litG');
    setHint();
  }
  function mcFlash(){
    if(mcI)return;
    var n=0;
    mcI=setInterval(function(){
      A('annMC',n%2===0,'litA');
      if(++n>5){clearInterval(mcI);mcI=null;A('annMC',false,'litA');}
    },280);
  }

  /* ---------- bombs and effects ---------- */
  function spawnBomb(){
    var el=document.createElementNS(SVGNS,'use');
    el.setAttribute('href','#bombGlyph');
    el.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href','#bombGlyph');
    bombLayer.appendChild(el);
    bombs.push({el:el,x:652,y:236,vx:0,vy:8,age:0});
  }
  function impact(xScreen){
    var wx=xScreen+offT;
    var fl=document.createElementNS(SVGNS,'circle');
    fl.setAttribute('cx',wx);fl.setAttribute('cy',GROUND_Y+6);
    fl.setAttribute('r',3);fl.setAttribute('fill','#ffd27a');
    var sm=document.createElementNS(SVGNS,'ellipse');
    sm.setAttribute('cx',wx);sm.setAttribute('cy',GROUND_Y+2);
    sm.setAttribute('rx',6);sm.setAttribute('ry',5);
    sm.setAttribute('fill','#43483f');sm.setAttribute('opacity','0.4');
    fxG.appendChild(sm);fxG.appendChild(fl);
    fx.push({fl:fl,sm:sm,age:0});
    if(blossomT<0)blossomT=0;
  }

  /* ---------- run flow ---------- */
  function setSR(){setC('sr',17800+Math.max(0,TG)*880,6);}
  function tickSecond(){
    if(phase!=='COUNT')return;
    TG--;
    if(TG<=0){
      TG=0;setC('tg',0,3);setSR();
      if(mode==='AUTO'){startSpill();}
      else{phase='HOLD';holdT=0;}
      return;
    }
    setC('tg',TG,3);setSR();
    if(mode==='AUTO'&&TG===12)doorsSet(true);
    if(TG<=5&&!toneActive){toneActive=true;A('annTone',true,'litW');toneOn();}
  }
  function pressRelease(){
    if(phase==='SPILL'||phase==='AAR'||phase==='REARM')return;
    if(!doorsOpen){mcFlash();return;}
    startSpill();
  }
  function startSpill(){
    if(phase==='SPILL')return;
    phase='SPILL';
    if(!doorsOpen)doorsSet(true,true);
    toneActive=false;toneOff();
    A('annTone',false,'litW');
    L('rel',true);A('annRel',true,'litG');
    dot('dot2',true);
    updateCues();
    spillI=setInterval(function(){
      wp--;if(wp<0)wp=0;
      setC('wp',wp,3);
      spawnBomb();thump(false);
      if(wp<=0){
        clearInterval(spillI);spillI=null;
        setTimeout(showRTB,3600);
        setTimeout(resetRun,8800);
      }
    },TICKS[intIdx]);
  }
  function showRTB(){
    G('rtbG').setAttribute('visibility','visible');
    L('rel',false);A('annRel',false,'litG');
    doorsSet(false);
    dot('dot2',false);
    phase='AAR';
    updateCues();
  }
  function resetRun(){
    G('rtbG').setAttribute('visibility','hidden');
    phase='REARM';
  }
  function rearmDone(){
    wp=108;setC('wp',wp,3);
    TG=42;trun=0;toneActive=false;
    setC('tg',TG,3);setSR();
    blossomT=-1;
    G('bdaRing').setAttribute('opacity','0');
    G('bdaGlow').setAttribute('opacity','0');
    G('tgtBlobs').setAttribute('opacity','1');
    phase='COUNT';
    updateCues();
  }

  /* ---------- input ---------- */
  function on(id,fn){
    var e=G(id);
    var h=function(ev){ev.preventDefault();fn();};
    if(window.PointerEvent)e.addEventListener('pointerdown',h);
    else{e.addEventListener('mousedown',h);e.addEventListener('touchstart',h);}
  }
  on('doorsHit',function(){
    if(rm)return;
    if(phase==='SPILL')return;
    takeJet();click();
    doorsSet(!doorsOpen);
  });
  on('guardHit',function(){
    if(rm)return;
    takeJet();click();
    guardOpen=!guardOpen;
    G('guardCover').setAttribute('transform','rotate('+(guardOpen?150:0)+' 1842 810)');
    btnHitEl.style.display=guardOpen?'':'none';
    guardHitEl.setAttribute('y',guardOpen?820:694);
    guardHitEl.setAttribute('height',guardOpen?70:128);
  });
  on('btnHit',function(){
    if(rm)return;
    if(!guardOpen)return;
    click();
    G('relBtn').setAttribute('transform','translate(0 1.5)');
    setTimeout(function(){G('relBtn').removeAttribute('transform');},140);
    pressRelease();
  });
  on('intHit',function(){
    if(rm)return;
    if(phase==='SPILL')return;
    intIdx=(intIdx+1)%5;
    G('intPtr').setAttribute('transform','rotate('+INT_ANG[intIdx]+')');
    click();
  });
  on('volHit',function(){
    var v=(volIdx+1)%3;
    setVol(v);
    G('volPtr').setAttribute('transform','translate(1810 130) rotate('+[-42,0,42][v]+')');
    click();
  });

  /* ---------- frame loop ---------- */
  var last=null;
  function frame(ts){
    if(last===null)last=ts;
    var dt=Math.min(0.05,(ts-last)/1000);
    last=ts;
    trun+=dt;

    offT+=SPD*dt;offC+=CLOUD_SPD*dt;
    terrG.setAttribute('transform','translate('+(-(offT%1360))+' 0)');
    cloudG.setAttribute('transform','translate('+(-(offC%1360))+' 0)');
    fxG.setAttribute('transform','translate('+(-offT)+' 0)');

    var TGv=42-trun;
    tgtMark.setAttribute('transform','translate('+(930+SPD*TGv)+' 0)');
    ipMark.setAttribute('transform','translate('+(652+SPD*(TGv-30))+' 0)');
    rngVal.textContent=Math.max(0,TGv*0.125).toFixed(1)+' NM';

    if(phase==='HOLD'){
      holdT+=dt;
      if(holdT>6)toneOff();
    }

    var i,b;
    for(i=bombs.length-1;i>=0;i--){
      b=bombs[i];b.age+=dt;
      b.vx=Math.max(-55,b.vx-16*dt);
      b.vy+=GRAV*dt;
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(b.y>=GROUND_Y){
        impact(b.x);
        bombLayer.removeChild(b.el);
        bombs.splice(i,1);
      }else{
        var rot=-80*Math.max(0,1-b.age*1.4);
        b.el.setAttribute('transform','translate('+b.x+' '+b.y+') rotate('+rot+') scale(1.6)');
      }
    }
    for(i=fx.length-1;i>=0;i--){
      var f=fx[i];f.age+=dt;
      f.fl.setAttribute('r',3+f.age*70);
      f.fl.setAttribute('opacity',Math.max(0,0.95-f.age*2.4));
      f.sm.setAttribute('rx',6+f.age*13);
      f.sm.setAttribute('ry',5+f.age*6);
      f.sm.setAttribute('cy',GROUND_Y+2-f.age*9);
      f.sm.setAttribute('opacity',Math.max(0,0.4*(1-f.age/2.6)));
      if(f.age>2.6){
        fxG.removeChild(f.fl);fxG.removeChild(f.sm);
        fx.splice(i,1);
      }
    }
    if(blossomT>=0){
      blossomT+=dt;
      if(blossomT<2.2){
        G('bdaRing').setAttribute('r',5+blossomT*30);
        G('bdaRing').setAttribute('opacity',Math.max(0,0.9*(1-blossomT/2.2)));
        G('bdaGlow').setAttribute('opacity',Math.max(0.15,0.85*(1-blossomT/2.6)));
      }else{
        G('bdaRing').setAttribute('opacity','0');
        G('bdaGlow').setAttribute('r','22');
        G('bdaGlow').setAttribute('opacity','0.15');
        G('tgtBlobs').setAttribute('opacity','0.35');
      }
    }
    if(phase==='REARM'){
      wp=Math.min(108,wp+240*dt);
      setC('wp',wp,3);
      if(wp>=108)rearmDone();
    }
    window.requestAnimationFrame(frame);
  }

  /* ---------- boot ---------- */
  setHint();
  (function(){
    var tg=G('tally');
    if(tg){
      for(var i=0;i<175;i++){
        var r=Math.floor(i/35),c=i%35;
        var p=document.createElementNS(SVGNS,'path');
        p.setAttribute('d','M0 2.5 C1 0.8 1 -1.8 0 -3.1 C-1 -1.8 -1 0.8 0 2.5 Z');
        p.setAttribute('fill','#d9b44a');
        p.setAttribute('transform','translate('+(656+c*13)+' '+(903+r*6.8)+') scale(1.25)');
        tg.appendChild(p);
      }
    }
  })();
  if(rm){
    if(svg.pauseAnimations)svg.pauseAnimations();
    cueDoorsEl.classList.add('on');
    return;
  }
  doorsSet(false,true);
  updateCues();
  tickI=setInterval(tickSecond,1000);
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
