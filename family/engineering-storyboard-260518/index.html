  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

10-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"4af67e0b-5c8f-4e23-992c-6174c3b93ea8\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"dfebbbb6-3738-4e95-84b0-5a8874ed348b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\u003C/style>\n\u003Cstyle>\n  :root {\n    --bg-0: #07090c;\n    --bg-1: #0b0e13;\n    --bg-2: #11161d;\n    --line-1: rgba(220, 232, 245, 0.06);\n    --line-2: rgba(220, 232, 245, 0.12);\n    --line-3: rgba(220, 232, 245, 0.22);\n    --ink-0: rgba(232, 240, 248, 0.98);\n    --ink-1: rgba(232, 240, 248, 0.88);\n    --ink-2: rgba(232, 240, 248, 0.72);\n    --ink-3: rgba(232, 240, 248, 0.62);\n  }\n  * { box-sizing: border-box; }\n  html, body {\n    margin: 0; padding: 0;\n    background: #000;\n    color: var(--ink-0);\n    font-family: \"Manrope\", system-ui, sans-serif;\n    overflow: hidden;\n  }\n  .mono { font-family: \"JetBrains Mono\", ui-monospace, monospace; }\n\n  /* ─── deck slide base ─── */\n  deck-stage > section {\n    width: 1920px; height: 1080px;\n    background: var(--bg-0);\n    background-image:\n      radial-gradient(ellipse 1400px 700px at 20% -10%, rgba(180,210,240,0.04), transparent 60%),\n      radial-gradient(ellipse 1100px 600px at 100% 50%, rgba(180,210,240,0.025), transparent 60%);\n    color: var(--ink-0);\n    position: relative;\n    overflow: hidden;\n    padding: 96px 120px;\n  }\n\n  /* Watermark grid on every slide */\n  deck-stage > section::before {\n    content: \"\";\n    position: absolute; inset: 0;\n    background-image:\n      linear-gradient(to right, var(--line-1) 1px, transparent 1px),\n      linear-gradient(to bottom, var(--line-1) 1px, transparent 1px);\n    background-size: 64px 64px;\n    pointer-events: none;\n    opacity: 0.5;\n  }\n\n  /* ─── scene scaffolding ─── */\n  .scene-num {\n    font-family: \"JetBrains Mono\", monospace;\n    font-size: 18px;\n    letter-spacing: 0.32em;\n    color: var(--ink-3);\n    display: flex; align-items: center; gap: 16px;\n  }\n  .scene-num::after {\n    content: \"\"; width: 80px; height: 1px; background: var(--line-2);\n  }\n  .scene-act {\n    font-family: \"JetBrains Mono\", monospace;\n    font-size: 14px;\n    letter-spacing: 0.4em;\n    color: var(--ink-3);\n    text-transform: uppercase;\n    margin-top: 16px;\n  }\n  h2 {\n    font-size: 88px;\n    font-weight: 200;\n    letter-spacing: -0.025em;\n    margin: 32px 0 28px;\n    line-height: 1.0;\n  }\n  h2 em { font-style: normal; color: var(--ink-2); font-weight: 200; }\n  h2 b { font-weight: 600; }\n  .lede {\n    font-size: 28px;\n    line-height: 1.4;\n    color: var(--ink-0);\n    max-width: 840px;\n    margin: 0 0 18px;\n    text-wrap: pretty;\n  }\n  p.body {\n    font-size: 22px;\n    line-height: 1.5;\n    color: var(--ink-1);\n    max-width: 760px;\n    margin: 0 0 14px;\n    text-wrap: pretty;\n  }\n\n  /* slide layout helpers */\n  .split {\n    display: grid;\n    grid-template-columns: 720px 1fr;\n    gap: 80px;\n    height: 100%;\n    align-items: center;\n  }\n  .split.reversed { grid-template-columns: 1fr 720px; }\n  .split.reversed .scene-text { order: 2; }\n  .split.reversed .scene-stage { order: 1; }\n  .scene-text { max-width: 720px; }\n  .scene-stage { width: 100%; height: 100%; position: relative; }\n\n  /* full layout (centered title above big stage) */\n  .full {\n    display: grid;\n    grid-template-rows: auto 1fr;\n    gap: 36px;\n    height: 100%;\n  }\n  .full > .scene-stage { width: 100%; height: 100%; }\n\n  /* corner registration marks */\n  .corners::before, .corners::after,\n  .corners > i::before, .corners > i::after {\n    content: \"\"; position: absolute;\n    width: 24px; height: 24px;\n    border: 1px solid var(--line-3);\n    z-index: 5;\n  }\n  .corners::before { top: 0; left: 0; border-right: none; border-bottom: none; }\n  .corners::after  { top: 0; right: 0; border-left: none; border-bottom: none; }\n  .corners > i::before { bottom: 0; left: 0; border-right: none; border-top: none; position: absolute; }\n  .corners > i::after  { bottom: 0; right: 0; border-left: none; border-top: none; position: absolute; }\n\n  .stage-frame {\n    position: relative;\n    width: 100%; height: 100%;\n    background: var(--bg-1);\n    border: 1px solid var(--line-1);\n    overflow: hidden;\n  }\n  .stage-frame::before {\n    content: \"\";\n    position: absolute; inset: 0;\n    background-image:\n      linear-gradient(to right, var(--line-1) 1px, transparent 1px),\n      linear-gradient(to bottom, var(--line-1) 1px, transparent 1px);\n    background-size: 40px 40px;\n    pointer-events: none;\n  }\n  .stage-label {\n    position: absolute; bottom: 20px; left: 24px;\n    font-family: \"JetBrains Mono\", monospace;\n    font-size: 14px;\n    letter-spacing: 0.18em;\n    color: var(--ink-3);\n    text-transform: uppercase;\n    z-index: 4;\n  }\n  .stage-label.right { left: auto; right: 24px; }\n  .stage-label.top   { top: 20px; bottom: auto; }\n\n  /* meta list */\n  .meta-list { margin: 36px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--line-1); }\n  .meta-list li {\n    display: grid; grid-template-columns: 220px 1fr;\n    padding: 16px 0;\n    border-bottom: 1px solid var(--line-1);\n    font-size: 18px;\n    font-family: \"JetBrains Mono\", monospace;\n    color: var(--ink-1);\n  }\n  .meta-list li b {\n    font-weight: 400; color: var(--ink-3);\n    letter-spacing: 0.12em; text-transform: uppercase;\n    font-size: 14px;\n  }\n\n  /* svg styles */\n  .structure-svg { width: 100%; height: 100%; display: block; }\n  .structure-svg .strut { stroke: var(--ink-1); stroke-width: 0.55; fill: none; }\n  .structure-svg .strut-back { stroke: var(--ink-2); stroke-width: 0.4; fill: none; opacity: 0.4; }\n  .structure-svg .pin { fill: var(--ink-0); }\n  .structure-svg .pin-back { fill: var(--ink-2); opacity: 0.5; }\n  .structure-svg .axis { stroke: var(--line-3); stroke-width: 0.5; }\n  .structure-svg .axis-label { fill: var(--ink-3); font-family: \"JetBrains Mono\", monospace; font-size: 9px; }\n\n  /* ─── Cover ─── */\n  .cover {\n    display: grid;\n    grid-template-rows: 1fr auto;\n    gap: 60px;\n    padding: 120px;\n  }\n  .cover .eyebrow {\n    font-family: \"JetBrains Mono\", monospace;\n    font-size: 24px;\n    letter-spacing: 0.4em;\n    color: var(--ink-3);\n    text-transform: uppercase;\n    margin-bottom: 48px;\n  }\n  .cover h1 {\n    font-size: 168px;\n    font-weight: 200;\n    letter-spacing: -0.03em;\n    line-height: 0.96;\n    margin: 0;\n  }\n  .cover h1 b { font-weight: 600; }\n  .cover h1 em { font-style: normal; color: var(--ink-2); font-weight: 200; }\n  .cover-sub {\n    font-size: 26px;\n    color: var(--ink-1);\n    max-width: 1100px;\n    margin: 36px 0 0;\n    line-height: 1.5;\n  }\n  .cover-meta {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 60px;\n    border-top: 1px solid var(--line-1);\n    padding-top: 36px;\n    font-family: \"JetBrains Mono\", monospace;\n    font-size: 24px;\n    color: var(--ink-1);\n  }\n  .cover-meta b {\n    color: var(--ink-3); letter-spacing: 0.18em;\n    text-transform: uppercase; font-weight: 400;\n    font-size: 18px; display: block; margin-bottom: 12px;\n  }\n\n  /* recalc counter */\n  .recalc-counter { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }\n  .recalc-num {\n    font-family: \"JetBrains Mono\", monospace;\n    font-size: 140px; font-weight: 200;\n    letter-spacing: -0.03em; line-height: 1;\n    color: var(--ink-0);\n  }\n  .recalc-label {\n    font-family: \"JetBrains Mono\", monospace;\n    font-size: 16px; letter-spacing: 0.24em;\n    color: var(--ink-3); text-transform: uppercase;\n  }\n\n  /* windows for theatre scenes */\n  .window {\n    position: absolute;\n    background: var(--bg-2);\n    border: 1px solid var(--line-2);\n    box-shadow: 0 24px 80px rgba(0,0,0,0.6);\n    display: flex; flex-direction: column;\n    overflow: hidden;\n  }\n  .window-bar {\n    height: 44px;\n    background: rgba(255,255,255,0.025);\n    border-bottom: 1px solid var(--line-1);\n    display: flex; align-items: center;\n    padding: 0 18px; gap: 14px;\n    flex-shrink: 0;\n  }\n  .window-dots { display: flex; gap: 8px; }\n  .window-dots span {\n    width: 12px; height: 12px; border-radius: 50%;\n    background: var(--line-3);\n  }\n  .window-title {\n    font-family: \"JetBrains Mono\", monospace;\n    font-size: 14px;\n    color: var(--ink-2);\n    letter-spacing: 0.08em;\n  }\n  .window-body {\n    flex: 1;\n    overflow: hidden;\n    padding: 24px 28px;\n    font-family: \"JetBrains Mono\", monospace;\n    font-size: 18px;\n    line-height: 1.55;\n    color: var(--ink-1);\n  }\n  .window-body.scroll { overflow-y: auto; }\n  .caret {\n    display: inline-block;\n    width: 10px; height: 22px;\n    background: var(--ink-0);\n    vertical-align: text-bottom;\n    margin-left: 2px;\n    animation: blink 1s steps(2) infinite;\n  }\n  @keyframes blink { 50% { opacity: 0; } }\n  .code-line { white-space: pre; color: var(--ink-1); font-size: 17px; line-height: 1.6; }\n  .code-line .kw { color: oklch(0.78 0.04 60); }\n  .code-line .str { color: oklch(0.78 0.04 200); }\n  .code-line .com { color: var(--ink-3); }\n  .code-line .num { color: oklch(0.8 0.05 150); }\n\n  /* checklist */\n  .checklist { list-style: none; padding: 0; margin: 0; font-family: \"JetBrains Mono\", monospace; font-size: 18px; }\n  .checklist li {\n    padding: 14px 0;\n    border-bottom: 1px solid var(--line-1);\n    display: grid; grid-template-columns: 26px 1fr auto;\n    gap: 14px; align-items: center;\n    color: var(--ink-2);\n    transition: color 0.4s ease;\n  }\n  .checklist li.done { color: var(--ink-0); }\n  .checklist li .mark {\n    width: 16px; height: 16px;\n    border: 1px solid var(--line-3);\n    position: relative;\n    transition: all 0.3s ease;\n  }\n  .checklist li.done .mark { background: var(--ink-0); border-color: var(--ink-0); }\n  .checklist li.done .mark::after {\n    content: \"\"; position: absolute;\n    inset: 3px;\n    border-bottom: 2px solid var(--bg-0);\n    border-right: 2px solid var(--bg-0);\n    transform: rotate(45deg) translate(-1px, -2px);\n    width: 5px; height: 9px;\n  }\n  .checklist li .t {\n    font-size: 13px; color: var(--ink-3);\n  }\n\n  /* readout */\n  .readout {\n    display: grid; grid-template-columns: auto auto;\n    gap: 8px 32px;\n    font-family: \"JetBrains Mono\", monospace;\n    font-size: 19px;\n  }\n  .readout b { color: var(--ink-3); font-weight: 400; }\n  .readout span { color: var(--ink-0); }\n\n  /* implication grid */\n  .implication-grid {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 24px;\n    height: 100%;\n    padding: 36px;\n  }\n  .imp-card {\n    border: 1px solid var(--line-2);\n    padding: 32px;\n    display: flex; flex-direction: column;\n    background: rgba(255,255,255,0.015);\n  }\n  .imp-card .num {\n    font-family: \"JetBrains Mono\", monospace;\n    font-size: 14px; color: var(--ink-3);\n    letter-spacing: 0.32em; margin-bottom: 16px;\n  }\n  .imp-card h4 {\n    margin: 0 0 12px;\n    font-size: 28px;\n    font-weight: 400;\n    color: var(--ink-0);\n    line-height: 1.15;\n  }\n  .imp-card p {\n    margin: 0;\n    font-size: 18px;\n    color: var(--ink-2);\n    line-height: 1.45;\n  }\n  .imp-card .visual {\n    margin-top: auto;\n    padding-top: 24px;\n    height: 120px;\n  }\n\n\n  /* v6 revised — cover bullets */\n  .cover-meta-bullets {\n    display: block !important;\n    margin-top: 32px;\n    border-top: 1px solid var(--line-1);\n    padding-top: 24px;\n  }\n  .cover-bullets-head {\n    font-size: 14px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--ink-2);\n    font-family: 'JetBrains Mono', monospace;\n    margin-bottom: 14px;\n  }\n  .cover-bullets {\n    list-style: none;\n    padding: 0;\n    margin: 0;\n    display: flex;\n    flex-direction: column;\n    gap: 10px;\n  }\n  .cover-bullets li {\n    font-size: 24px;\n    color: var(--ink-1);\n    padding-left: 28px;\n    position: relative;\n  }\n  .cover-bullets li::before {\n    content: '›';\n    position: absolute;\n    left: 0;\n    color: var(--ink-3);\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 28px;\n    line-height: 1;\n  }\n\n  /* outro */\n  .outro {\n    display: flex; flex-direction: column;\n    align-items: center; justify-content: center;\n    gap: 32px; text-align: center;\n  }\n  .outro-mark {\n    width: 56px; height: 56px;\n    border: 1px solid var(--line-3);\n    position: relative;\n  }\n  .outro-mark::before, .outro-mark::after {\n    content: \"\"; position: absolute; background: var(--ink-1);\n  }\n  .outro-mark::before { left: 50%; top: 10px; bottom: 10px; width: 1.5px; transform: translateX(-50%); }\n  .outro-mark::after  { top: 50%; left: 10px; right: 10px; height: 1.5px; transform: translateY(-50%); }\n  .outro h2 { font-size: 88px; max-width: 1400px; }\n  .outro p { font-size: 26px; color: var(--ink-2); max-width: 800px; }\n\n  /* ─── controls (overlay outside the deck, fixed to viewport) ─── */\n  .controls {\n    position: fixed;\n    bottom: 24px;\n    left: 50%;\n    transform: translateX(-50%);\n    z-index: 100;\n    display: flex; align-items: center; gap: 4px;\n    padding: 8px;\n    background: rgba(15, 18, 24, 0.85);\n    backdrop-filter: blur(12px);\n    border: 1px solid rgba(255,255,255,0.08);\n    border-radius: 999px;\n    font-family: \"JetBrains Mono\", monospace;\n  }\n  .ctl-btn {\n    appearance: none;\n    border: none;\n    background: transparent;\n    color: var(--ink-1);\n    width: 40px; height: 40px;\n    border-radius: 999px;\n    cursor: pointer;\n    display: flex; align-items: center; justify-content: center;\n    transition: background 0.15s, color 0.15s;\n  }\n  .ctl-btn:hover { background: rgba(255,255,255,0.08); color: var(--ink-0); }\n  .ctl-btn:disabled { opacity: 0.3; cursor: default; }\n  .ctl-btn svg { width: 18px; height: 18px; }\n  .ctl-counter {\n    padding: 0 14px;\n    font-size: 12px;\n    color: var(--ink-2);\n    letter-spacing: 0.12em;\n    min-width: 80px; text-align: center;\n  }\n  .ctl-progress {\n    height: 2px; width: 140px;\n    background: rgba(255,255,255,0.1);\n    border-radius: 999px;\n    overflow: hidden;\n    margin: 0 8px;\n  }\n  .ctl-progress > span {\n    display: block; height: 100%;\n    background: var(--ink-0);\n    width: 0%;\n    transition: width 0.18s linear;\n  }\n  .autoplay-indicator {\n    width: 8px; height: 8px;\n    border-radius: 50%;\n    background: var(--ink-3);\n    margin-left: 4px;\n    transition: background 0.3s;\n  }\n  .autoplay-indicator.active {\n    background: oklch(0.78 0.16 145);\n    animation: pulse 1.5s ease-in-out infinite;\n  }\n  @keyframes pulse {\n    0%, 100% { opacity: 1; transform: scale(1); }\n    50% { opacity: 0.5; transform: scale(1.4); }\n  }\n\n  /* hints */\n  .hint {\n    position: fixed; top: 16px; right: 16px;\n    z-index: 100;\n    font-family: \"JetBrains Mono\", monospace;\n    font-size: 11px;\n    color: var(--ink-3);\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    background: rgba(15,18,24,0.6);\n    backdrop-filter: blur(8px);\n    border: 1px solid rgba(255,255,255,0.06);\n    padding: 8px 12px;\n    border-radius: 6px;\n    transition: opacity 0.5s;\n  }\n  .hint kbd {\n    display: inline-block;\n    background: rgba(255,255,255,0.08);\n    border: 1px solid rgba(255,255,255,0.1);\n    border-radius: 3px;\n    padding: 1px 6px;\n    margin: 0 2px;\n    font-family: inherit;\n    color: var(--ink-1);\n  }\n\u003C/style>\n\u003Cstyle id=\"presentation-display-frame-css\">\n  :root { --presentation-stage-scale: 1; }\n  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }\n  body { position: relative; }\n  .presentation-stage-canvas {\n    position: fixed;\n    left: 50%;\n    top: 50%;\n    width: 1920px;\n    height: 1080px;\n    transform: translate(-50%, -50%) scale(var(--presentation-stage-scale));\n    transform-origin: center center;\n    overflow: hidden;\n  }\n\u003C/style>\n\u003Cscript id=\"presentation-display-frame-js\">\n(() => {\n  const STAGE_WIDTH = 1920;\n  const STAGE_HEIGHT = 1080;\n\n  function fitPresentationStage() {\n    const scale = Math.min(window.innerWidth / STAGE_WIDTH, window.innerHeight / STAGE_HEIGHT);\n    document.documentElement.style.setProperty('--presentation-stage-scale', String(scale));\n  }\n\n  window.addEventListener('resize', fitPresentationStage);\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', fitPresentationStage, { once: true });\n  }\n  fitPresentationStage();\n})();\n\u003C/script>\n\u003C/head>\n\u003Cbody>\n\u003Cdiv class=\"presentation-stage-canvas\" data-display-canvas=\"1920x1080\">\n\n\u003Cdeck-stage width=\"1920\" height=\"1080\">\n\n\u003Csection data-label=\"Cover\" class=\"cover\">\n  \u003Cdiv>\n    \u003Cdiv class=\"eyebrow\">An Automated Structure Engineering Storyboard\u003C/div>\n    \u003Ch1>From \u003Cem>engineering intent\u003C/em>\u003Cbr>to \u003Cb>machine execution.\u003C/b>\u003C/h1>\n    \u003Cp class=\"cover-sub\">A walkthrough of how a complex curved structure gets designed, translated, and produced by a machine. The engineer owns the design. The model writes the translation.\u003C/p>\n  \u003C/div>\n  \u003Cdiv class=\"cover-meta cover-meta-bullets\">\n    \u003Cdiv class=\"cover-bullets-head\">ChatGPT use cases to optimize complex design process:\u003C/div>\n    \u003Cul class=\"cover-bullets\">\n      \u003Cli>Code to create a 3D model of a complex design\u003C/li>\n      \u003Cli>Building a semi-automated matrix for prototype manufacturing\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\u003C/section>\n\n\u003Csection data-label=\"01 Curved Structure\" data-scene=\"1\">\n  \u003Cdiv class=\"split\">\n    \u003Cdiv class=\"scene-text\">\n      \u003Cdiv class=\"scene-num\">SCENE · 01\u003C/div>\n      \u003Cdiv class=\"scene-act\">The Part\u003C/div>\n      \u003Ch2>Curved Structure.\u003C/h2>\n      \u003Cp class=\"lede\">A compact geometric form generated from a continuous path. The design changes diameter along a curved route, which makes translation from intent to machine instructions harder than it looks.\u003C/p>\n      \u003Cp class=\"body\">It looks simple. It is not.\u003C/p>\n      \u003Cul class=\"meta-list\">\n        \u003Cli>\u003Cb>Material\u003C/b>continuous path\u003C/li>\n        \u003Cli>\u003Cb>Form\u003C/b>peaks, valleys, and a helical pattern\u003C/li>\n        \u003Cli>\u003Cb>Behavior\u003C/b>shape-retaining geometry\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n    \u003Cdiv class=\"scene-stage\">\n      \u003Cdiv class=\"stage-frame corners\">\u003Ci>\u003C/i>\n        \u003Cdiv id=\"s1-structure\" style=\"width:100%;height:100%;\">\u003C/div>\n        \u003Cspan class=\"stage-label\">Specimen · 01\u003C/span>\n        \u003Cspan class=\"stage-label right\">Variable · 8mm → 16mm\u003C/span>\n      \u003C/div>\n    \u003C/div>\n  \u003C/div>\n\u003C/section>\n\n\u003Csection data-label=\"02 How One Gets Built\" data-scene=\"4\">\n  \u003Cdiv class=\"full\" style=\"grid-template-rows: auto minmax(0, 1fr); padding-bottom: 64px;\">\n    \u003Cdiv>\n      \u003Cdiv class=\"scene-num\">SCENE · 02\u003C/div>\n      \u003Cdiv class=\"scene-act\">How One Gets Built\u003C/div>\n      \u003Cp class=\"lede\" style=\"max-width:1500px;font-size:26px;line-height:1.5;margin-top:18px;\">A structure is wound onto a mandrel — a metal core studded with hundreds of pins. A machine wraps a single flexible wire around the pins in a precise helical path. Each pin defines a peak or a valley.\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"scene-stage\">\n      \u003Cdiv class=\"stage-frame corners\">\u003Ci>\u003C/i>\n        \u003Cdiv style=\"display:grid;grid-template-columns:1fr 1px 1fr;height:100%;\">\n          \u003Cdiv style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;gap:20px;\">\n            \u003Cdiv style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.2em;color:var(--ink-3);text-transform:uppercase;\">Straight · Works\u003C/div>\n            \u003Cdiv id=\"s4-cyl\" style=\"width:60%;height:60%;\">\u003C/div>\n            \u003Cdiv style=\"font-size:20px;color:var(--ink-1);text-align:center;max-width:440px;\">A rectangle wraps a cylinder cleanly. Pins line up.\u003C/div>\n          \u003C/div>\n          \u003Cdiv style=\"background:var(--line-1);\">\u003C/div>\n          \u003Cdiv style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;gap:20px;\">\n            \u003Cdiv style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.2em;color:var(--ink-3);text-transform:uppercase;\">Variable · Fails\u003C/div>\n            \u003Cdiv id=\"s4-cone\" style=\"width:60%;height:60%;\">\u003C/div>\n            \u003Cdiv style=\"font-size:20px;color:var(--ink-1);text-align:center;max-width:440px;\">A rectangle cannot wrap on a cone. Pins drift out of alignment.\u003C/div>\n          \u003C/div>\n        \u003C/div>\n        \u003Cspan class=\"stage-label\">Comparison · Cylinder vs Cone\u003C/span>\n      \u003C/div>\n    \u003C/div>\n    \u003Ch2 style=\"position:absolute;bottom:48px;left:0;right:0;margin:0;font-size:48px;text-align:center;line-height:1;font-weight:300;letter-spacing:-0.02em;\">A rectangle cannot wrap on a cone.\u003C/h2>\n  \u003C/div>\n\u003C/section>\n\n\u003Csection data-label=\"03 Conical Transformation\" data-scene=\"9\">\n  \u003Cdiv class=\"full\">\n    \u003Cdiv>\n      \u003Cdiv class=\"scene-num\">SCENE · 03\u003C/div>\n      \u003Cdiv class=\"scene-act\">Using AI for Variable Design · The Conical Transformation\u003C/div>\n      \u003Ch2 style=\"margin-top:18px;font-size:72px;\">Flat → sector → cone.\u003C/h2>\n    \u003C/div>\n    \u003Cdiv class=\"scene-stage\">\n      \u003Cdiv class=\"stage-frame corners\">\u003Ci>\u003C/i>\n        \u003Cdiv style=\"display:grid;grid-template-columns:1fr 60px 1fr 60px 1fr;height:100%;align-items:center;padding:40px;gap:20px;\">\n          \u003Cdiv style=\"display:flex;flex-direction:column;align-items:center;gap:18px;\">\n            \u003Cdiv style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.2em;color:var(--ink-3);text-transform:uppercase;\">01 · Flat Grid\u003C/div>\n            \u003Cdiv id=\"s9-flat\" style=\"width:100%;height:280px;\">\u003C/div>\n            \u003Cdiv style=\"font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--ink-1);\">r₁ = 8 mm\u003C/div>\n          \u003C/div>\n          \u003Cdiv style=\"font-family:'JetBrains Mono',monospace;color:var(--ink-2);font-size:48px;text-align:center;\">→\u003C/div>\n          \u003Cdiv style=\"display:flex;flex-direction:column;align-items:center;gap:18px;\">\n            \u003Cdiv style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.2em;color:var(--ink-3);text-transform:uppercase;\">02 · Unwrapped Sector\u003C/div>\n            \u003Cdiv id=\"s9-sector\" style=\"width:100%;height:280px;\">\u003C/div>\n            \u003Cdiv style=\"font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--ink-1);\">r₂ = 16 mm\u003C/div>\n          \u003C/div>\n          \u003Cdiv style=\"font-family:'JetBrains Mono',monospace;color:var(--ink-2);font-size:48px;text-align:center;\">→\u003C/div>\n          \u003Cdiv style=\"display:flex;flex-direction:column;align-items:center;gap:18px;\">\n            \u003Cdiv style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.2em;color:var(--ink-3);text-transform:uppercase;\">03 · Wrapped on Cone\u003C/div>\n            \u003Cdiv id=\"s9-cone\" style=\"width:100%;height:280px;\">\u003C/div>\n            \u003Cdiv style=\"font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--ink-1);\">H = 40 mm\u003C/div>\n          \u003C/div>\n        \u003C/div>\n        \u003Cspan class=\"stage-label\">Conical Transformation · Three Stages\u003C/span>\n      \u003C/div>\n    \u003C/div>\n  \u003C/div>\n\u003C/section>\n\n\u003Csection data-label=\"04 The Grid\" data-scene=\"5\">\n  \u003Cdiv class=\"split reversed\">\n    \u003Cdiv class=\"scene-text\">\n      \u003Cdiv class=\"scene-num\">SCENE · 04\u003C/div>\n      \u003Cdiv class=\"scene-act\">The Grid\u003C/div>\n      \u003Ch2>Math. Precision. \u003Cem>Complexity.\u003C/em>\u003C/h2>\n      \u003Cp class=\"lede\">For each pin on the cone, the engineer needs three coordinates — \u003Cspan class=\"mono\">X\u003C/span>, \u003Cspan class=\"mono\">Y\u003C/span>, \u003Cspan class=\"mono\">Z\u003C/span> — plus an angle and a peak/valley flag.\u003C/p>\n      \u003Cp class=\"body\">Twenty-two pins around. Up to thirty-five rows tall.\u003C/p>\n      \u003Cp class=\"body\">And every time a designer tweaks the radius, the height, or the pin count, every cell recalculates.\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"scene-stage\">\n      \u003Cdiv class=\"stage-frame corners\">\u003Ci>\u003C/i>\n        \u003Cdiv style=\"display:grid;grid-template-columns:1fr 1fr;height:100%;align-items:center;\">\n          \u003Cdiv id=\"s5-grid\" style=\"width:100%;height:100%;padding:30px;\">\u003C/div>\n          \u003Cdiv style=\"padding:60px;\">\n            \u003Cdiv class=\"recalc-counter\">\n              \u003Cdiv class=\"recalc-num mono\" id=\"recalc-num\">0\u003C/div>\n              \u003Cdiv class=\"recalc-label\">Recalculations · One change\u003C/div>\n            \u003C/div>\n          \u003C/div>\n        \u003C/div>\n        \u003Cspan class=\"stage-label\">Pin Grid · Cone Surface\u003C/span>\n      \u003C/div>\n    \u003C/div>\n  \u003C/div>\n\u003C/section>\n\n\u003Csection data-label=\"05 Enter the Tool\" data-scene=\"7\">\n  \u003Cdiv class=\"full\">\n    \u003Cdiv>\n      \u003Cdiv class=\"scene-num\">SCENE · 05\u003C/div>\n      \u003Cdiv class=\"scene-act\">Enter the Tool · The A-ha Moment\u003C/div>\n      \u003Ch2 style=\"margin-top:18px;font-size:64px;\">The engineer owns the design. \u003Cem>The model writes the translation.\u003C/em>\u003C/h2>\n    \u003C/div>\n    \u003Cdiv class=\"scene-stage\">\n      \u003Cdiv class=\"stage-frame corners\">\u003Ci>\u003C/i>\n        \u003Cdiv id=\"theatre-7\" style=\"position:absolute;inset:0;\">\u003C/div>\n        \u003Cspan class=\"stage-label\">Translation Layer · Conversational\u003C/span>\n      \u003C/div>\n    \u003C/div>\n  \u003C/div>\n\u003C/section>\n\n\u003Csection data-label=\"06 Code Flows to CAD\" data-scene=\"8\">\n  \u003Cdiv class=\"full\">\n    \u003Cdiv>\n      \u003Cdiv class=\"scene-num\">SCENE · 06\u003C/div>\n      \u003Cdiv class=\"scene-act\">Code Flows to the CAD Tool\u003C/div>\n      \u003Ch2 style=\"margin-top:18px;font-size:64px;\">The macro arrives. \u003Cem>The sketch builds itself.\u003C/em>\u003C/h2>\n    \u003C/div>\n    \u003Cdiv class=\"scene-stage\">\n      \u003Cdiv class=\"stage-frame corners\">\u003Ci>\u003C/i>\n        \u003Cdiv id=\"theatre-8\" style=\"position:absolute;inset:0;\">\u003C/div>\n        \u003Cspan class=\"stage-label\">Macro Output → CAD Sketch\u003C/span>\n      \u003C/div>\n    \u003C/div>\n  \u003C/div>\n\u003C/section>\n\n\u003Csection data-label=\"07 Matrix Builds\" data-scene=\"10\">\n  \u003Cdiv class=\"split\">\n    \u003Cdiv class=\"scene-text\">\n      \u003Cdiv class=\"scene-num\">SCENE · 07\u003C/div>\n      \u003Cdiv class=\"scene-act\">Prepping For Manufacture\u003C/div>\n      \u003Ch2>One template.\u003Cbr>\u003Cem>Every size.\u003C/em>\u003Cbr>Minutes, not days.\u003C/h2>\n      \u003Cp class=\"lede\">The engineer sets three inputs: \u003Cspan class=\"mono\">X\u003C/span>, \u003Cspan class=\"mono\">A\u003C/span> (angle), \u003Cspan class=\"mono\">Z\u003C/span>. The template fills in the derived columns — \u003Cspan class=\"mono\">θ\u003C/span>, \u003Cspan class=\"mono\">r\u003C/span>, \u003Cspan class=\"mono\">X′ Y′ Z′\u003C/span> — for every pin in the build.\u003C/p>\n      \u003Cp class=\"body\">Twenty-two pins, up to thirty-five rows. Auto-filled. The engineer reviews. Approves. Moves on.\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"scene-stage\">\n      \u003Cdiv class=\"stage-frame corners\">\u003Ci>\u003C/i>\n        \u003Cdiv id=\"s10-matrix\" style=\"position:absolute;inset:0;\">\u003C/div>\n        \u003Cspan class=\"stage-label\">Pin Matrix · Auto-filled\u003C/span>\n        \u003Cspan class=\"stage-label right\">Inputs · Derived\u003C/span>\n      \u003C/div>\n    \u003C/div>\n  \u003C/div>\n\u003C/section>\n\n\u003Csection data-label=\"08 Machine Execution\" data-scene=\"11\">\n  \u003Cdiv class=\"split reversed\">\n    \u003Cdiv class=\"scene-text\">\n      \u003Cdiv class=\"scene-num\">SCENE · 08\u003C/div>\n      \u003Cdiv class=\"scene-act\">Machine Execution\u003C/div>\n      \u003Ch2>The table drives \u003Cem>the machine.\u003C/em>\u003C/h2>\n      \u003Cp class=\"lede\">The same matrix that defined the geometry is now the path the winding machine follows. Pin by pin. No translation step in between.\u003C/p>\n      \u003Cp class=\"body\">The wire goes on. The mandrel turns. The structure forms.\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"scene-stage\">\n      \u003Cdiv class=\"stage-frame corners\">\u003Ci>\u003C/i>\n        \u003Cdiv id=\"s11-host\" style=\"position:absolute;inset:0;\">\u003C/div>\n        \u003Cspan class=\"stage-label\">Winding Machine · Live\u003C/span>\n        \u003Cspan class=\"stage-label right\" id=\"s11-coord\">X 0.000 · Y 0.000 · Z 0.000\u003C/span>\n      \u003C/div>\n    \u003C/div>\n  \u003C/div>\n\u003C/section>\n\n\u003Csection data-label=\"09 The Reveal\" data-scene=\"12\">\n  \u003Cdiv class=\"split\">\n    \u003Cdiv class=\"scene-text\">\n      \u003Cdiv class=\"scene-num\">SCENE · 09\u003C/div>\n      \u003Cdiv class=\"scene-act\">The Reveal\u003C/div>\n      \u003Ch2>From intent \u003Cem>to wound structure.\u003C/em>\u003C/h2>\n      \u003Cp class=\"lede\">Engineer intent → AI translation → CAD execution → machine winding → finished part.\u003C/p>\n      \u003Cp class=\"body\">Each step preserves the engineer's design. None of it is autonomous. All of it is faster.\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"scene-stage\">\n      \u003Cdiv class=\"stage-frame corners\">\u003Ci>\u003C/i>\n        \u003Cdiv id=\"s12-structure\" style=\"width:100%;height:100%;\">\u003C/div>\n        \u003Cspan class=\"stage-label\">Finished Specimen · Reveal\u003C/span>\n      \u003C/div>\n    \u003C/div>\n  \u003C/div>\n\u003C/section>\n\n\u003C/deck-stage>\n\n\u003C!-- Top-right keyboard hint -->\n\u003Cdiv class=\"hint\" id=\"hint\">\n  \u003Ckbd>←\u003C/kbd> \u003Ckbd>→\u003C/kbd> nav · \u003Ckbd>SPACE\u003C/kbd> autoplay\n\u003C/div>\n\n\u003C!-- Bottom-center controls -->\n\u003Cdiv class=\"controls\">\n  \u003Cbutton class=\"ctl-btn\" id=\"ctl-prev\" title=\"Previous (←)\">\n    \u003Csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003Cpath d=\"M15 18l-6-6 6-6\">\u003C/path>\u003C/svg>\n  \u003C/button>\n  \u003Cbutton class=\"ctl-btn\" id=\"ctl-play\" title=\"Autoplay (Space)\">\n    \u003Csvg id=\"ctl-play-icon\" viewBox=\"0 0 24 24\" fill=\"currentColor\">\u003Cpath d=\"M8 5v14l11-7z\">\u003C/path>\u003C/svg>\n  \u003C/button>\n  \u003Cbutton class=\"ctl-btn\" id=\"ctl-next\" title=\"Next (→)\">\n    \u003Csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003Cpath d=\"M9 6l6 6-6 6\">\u003C/path>\u003C/svg>\n  \u003C/button>\n  \u003Cspan class=\"autoplay-indicator\" id=\"autoplay-indicator\">\u003C/span>\n  \u003Cspan class=\"ctl-counter\" id=\"ctl-counter\">01 / 14\u003C/span>\n  \u003Cdiv class=\"ctl-progress\">\u003Cspan id=\"ctl-progress-fill\">\u003C/span>\u003C/div>\n\u003C/div>\n\n\u003Cscript src=\"220ccc38-6f41-4e95-9f52-145e5e541da4\">\u003C/script>\n\n\u003C!-- ─────── Structure Engine + Scene logic (inlined to avoid serving issues) ─────── -->\n\u003Cscript>\n(function () {\n  'use strict';\n  const NS = 'http://www.w3.org/2000/svg';\n\n  // ─── Structure engine ───\n  function project(x, y, z, opts = {}) {\n    const { tiltX = 0.18, scale = 1, rotY = 0 } = opts;\n    const cy = Math.cos(rotY), sy = Math.sin(rotY);\n    const xr = x * cy + z * sy;\n    const zr = -x * sy + z * cy;\n    const cz = Math.cos(tiltX), sz = Math.sin(tiltX);\n    const yp = y * cz - zr * sz;\n    const zp = y * sz + zr * cz;\n    return { x: xr * scale, y: yp * scale, depth: zp };\n  }\n\n  function buildPins(opts) {\n    const { pinsAround = 16, rows = 8, r1 = 8, r2 = 14, height = 40 } = opts;\n    const pins = [];\n    for (let row = 0; row \u003C rows; row++) {\n      const t = row / (rows - 1);\n      const y = -height / 2 + t * height;\n      const r = r1 + (r2 - r1) * t;\n      const phaseOffset = (row % 2) * (Math.PI / pinsAround);\n      for (let i = 0; i \u003C pinsAround; i++) {\n        const theta = (i / pinsAround) * Math.PI * 2 + phaseOffset;\n        const x = r * Math.cos(theta);\n        const z = r * Math.sin(theta);\n        pins.push({ x, y, z, row, col: i, theta, isPeak: (row + i) % 2 === 0 });\n      }\n    }\n    return { pins, opts };\n  }\n\n  function buildSegments(pins, opts) {\n    const { pinsAround, rows } = opts;\n    const segs = [];\n    for (let row = 0; row \u003C rows - 1; row++) {\n      for (let i = 0; i \u003C pinsAround; i++) {\n        const a = pins[row * pinsAround + i];\n        const b = pins[(row + 1) * pinsAround + i];\n        const c = pins[(row + 1) * pinsAround + ((i + 1) % pinsAround)];\n        segs.push([a, b]); segs.push([b, c]);\n      }\n    }\n    return segs;\n  }\n\n  function renderStructure(target, opts = {}) {\n    const o = Object.assign({ pinsAround: 16, rows: 8, r1: 8, r2: 14, height: 40, rotation: -18 }, opts);\n    const { pins } = buildPins(o);\n    const segs = buildSegments(pins, o);\n    const rotY = (o.rotation * Math.PI) / 180;\n    const projOpts = { tiltX: 0.22, scale: 1, rotY };\n    const projPins = pins.map(p => Object.assign({ ref: p }, project(p.x, p.y, p.z, projOpts)));\n    const segData = segs.map(([a, b]) => {\n      const pa = projPins[pins.indexOf(a)];\n      const pb = projPins[pins.indexOf(b)];\n      return { pa, pb, depth: (pa.depth + pb.depth) / 2 };\n    });\n    segData.sort((u, v) => u.depth - v.depth);\n\n    const svg = document.createElementNS(NS, 'svg');\n    svg.setAttribute('class', 'structure-svg');\n    svg.setAttribute('viewBox', '-30 -32 60 64');\n    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');\n\n    const gBack = document.createElementNS(NS, 'g');\n    const gFront = document.createElementNS(NS, 'g');\n    const gPinsBack = document.createElementNS(NS, 'g');\n    const gPinsFront = document.createElementNS(NS, 'g');\n\n    segData.forEach(s => {\n      const line = document.createElementNS(NS, 'line');\n      line.setAttribute('x1', s.pa.x.toFixed(3));\n      line.setAttribute('y1', s.pa.y.toFixed(3));\n      line.setAttribute('x2', s.pb.x.toFixed(3));\n      line.setAttribute('y2', s.pb.y.toFixed(3));\n      const isBack = s.depth \u003C 0;\n      line.setAttribute('class', isBack ? 'strut-back' : 'strut');\n      (isBack ? gBack : gFront).appendChild(line);\n    });\n    projPins.forEach(pp => {\n      const dot = document.createElementNS(NS, 'circle');\n      dot.setAttribute('cx', pp.x.toFixed(3));\n      dot.setAttribute('cy', pp.y.toFixed(3));\n      const isBack = pp.depth \u003C 0;\n      dot.setAttribute('r', isBack ? 0.4 : 0.6);\n      dot.setAttribute('class', isBack ? 'pin-back' : 'pin');\n      (isBack ? gPinsBack : gPinsFront).appendChild(dot);\n    });\n\n    svg.appendChild(gBack);\n    svg.appendChild(gPinsBack);\n    svg.appendChild(gFront);\n    svg.appendChild(gPinsFront);\n\n    target.innerHTML = '';\n    target.appendChild(svg);\n    return svg;\n  }\n\n  // rotating renderer that returns a stop fn\n  function renderRotatingStructure(target, opts = {}) {\n    let rot = opts.rotation || -18;\n    let raf;\n    function frame() {\n      rot += 0.12;\n      renderStructure(target, Object.assign({}, opts, { rotation: rot }));\n      raf = requestAnimationFrame(frame);\n    }\n    frame();\n    return () => cancelAnimationFrame(raf);\n  }\n\n  function renderFlatGrid(target, opts = {}) {\n    const cols = opts.cols || 12, rows = opts.rows || 8;\n    const w = 60, h = 40;\n    const svg = document.createElementNS(NS, 'svg');\n    svg.setAttribute('class', 'structure-svg');\n    svg.setAttribute('viewBox', `${-w/2 - 6} ${-h/2 - 6} ${w + 12} ${h + 12}`);\n    const gGrid = document.createElementNS(NS, 'g');\n    for (let i = 0; i \u003C= cols; i++) {\n      const x = -w/2 + (i / cols) * w;\n      const ln = document.createElementNS(NS, 'line');\n      ln.setAttribute('x1', x); ln.setAttribute('x2', x);\n      ln.setAttribute('y1', -h/2); ln.setAttribute('y2', h/2);\n      ln.setAttribute('class', 'strut-back');\n      gGrid.appendChild(ln);\n    }\n    for (let j = 0; j \u003C= rows; j++) {\n      const y = -h/2 + (j / rows) * h;\n      const ln = document.createElementNS(NS, 'line');\n      ln.setAttribute('x1', -w/2); ln.setAttribute('x2', w/2);\n      ln.setAttribute('y1', y); ln.setAttribute('y2', y);\n      ln.setAttribute('class', 'strut-back');\n      gGrid.appendChild(ln);\n    }\n    svg.appendChild(gGrid);\n    const gPins = document.createElementNS(NS, 'g');\n    for (let j = 0; j \u003C= rows; j++)\n      for (let i = 0; i \u003C= cols; i++) {\n        const dot = document.createElementNS(NS, 'circle');\n        dot.setAttribute('cx', -w/2 + (i / cols) * w);\n        dot.setAttribute('cy', -h/2 + (j / rows) * h);\n        dot.setAttribute('r', 0.55);\n        dot.setAttribute('class', 'pin');\n        gPins.appendChild(dot);\n      }\n    svg.appendChild(gPins);\n    target.innerHTML = ''; target.appendChild(svg);\n    return svg;\n  }\n\n  function renderSector(target, opts = {}) {\n    const r1 = opts.r1Inner || 18, r2 = opts.r2Outer || 32;\n    const angle = opts.angle || (Math.PI * 0.9);\n    const cols = opts.cols || 12, rows = opts.rows || 8;\n    const cx = 0, cy = 16;\n    const svg = document.createElementNS(NS, 'svg');\n    svg.setAttribute('class', 'structure-svg');\n    svg.setAttribute('viewBox', '-36 -22 72 50');\n    function arcPath(r) {\n      const start = -angle / 2 - Math.PI / 2;\n      const end = angle / 2 - Math.PI / 2;\n      const x1 = cx + r * Math.cos(start), y1 = cy + r * Math.sin(start);\n      const x2 = cx + r * Math.cos(end), y2 = cy + r * Math.sin(end);\n      const large = angle > Math.PI ? 1 : 0;\n      return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;\n    }\n    const gridG = document.createElementNS(NS, 'g');\n    for (let i = 0; i \u003C= cols; i++) {\n      const t = i / cols;\n      const a = -angle/2 - Math.PI/2 + t * angle;\n      const x1 = cx + r1 * Math.cos(a), y1 = cy + r1 * Math.sin(a);\n      const x2 = cx + r2 * Math.cos(a), y2 = cy + r2 * Math.sin(a);\n      const ln = document.createElementNS(NS, 'line');\n      ln.setAttribute('x1', x1); ln.setAttribute('y1', y1);\n      ln.setAttribute('x2', x2); ln.setAttribute('y2', y2);\n      ln.setAttribute('class', 'strut-back');\n      gridG.appendChild(ln);\n    }\n    for (let j = 0; j \u003C= rows; j++) {\n      const r = r1 + (j / rows) * (r2 - r1);\n      const p = document.createElementNS(NS, 'path');\n      p.setAttribute('d', arcPath(r));\n      p.setAttribute('class', 'strut-back');\n      gridG.appendChild(p);\n    }\n    svg.appendChild(gridG);\n    const pinsG = document.createElementNS(NS, 'g');\n    for (let j = 0; j \u003C= rows; j++)\n      for (let i = 0; i \u003C= cols; i++) {\n        const r = r1 + (j / rows) * (r2 - r1);\n        const t = i / cols;\n        const a = -angle/2 - Math.PI/2 + t * angle;\n        const dot = document.createElementNS(NS, 'circle');\n        dot.setAttribute('cx', cx + r * Math.cos(a));\n        dot.setAttribute('cy', cy + r * Math.sin(a));\n        dot.setAttribute('r', 0.55);\n        dot.setAttribute('class', 'pin');\n        pinsG.appendChild(dot);\n      }\n    svg.appendChild(pinsG);\n    target.innerHTML = ''; target.appendChild(svg);\n    return svg;\n  }\n\n  window.SE = { renderStructure, renderRotatingStructure, renderFlatGrid, renderSector, buildPins, project };\n})();\n\u003C/script>\n\n\u003Cscript>\n// ─────────────────────────────────────────────────────────────\n// Scene wiring + autoplay + arrow controls\n// ─────────────────────────────────────────────────────────────\n(function () {\n  'use strict';\n  const SE = window.SE;\n  let activeStops = []; // cleanup fns for animations on prev slide\n  function cleanup() {\n    activeStops.forEach(f => { try { f(); } catch (e) {} });\n    activeStops = [];\n  }\n\n  // ─── Scene 1 ───\n  function scene1() {\n    const t = document.getElementById('s1-structure');\n    if (!t) return;\n    const stop = SE.renderRotatingStructure(t, { pinsAround: 18, rows: 9, r1: 8, r2: 14, height: 40 });\n    activeStops.push(stop);\n  }\n\n  // ─── Scene 2 ───\n  function scene2() {\n    const t = document.getElementById('s2-arch');\n    if (!t) return;\n    // structure placement inside BRANCH 3: a variable helical mesh between (196, 66) at base and (210, 24) at top\n    let path = '';\n    const rows = 12;\n    for (let i = 0; i \u003C= rows; i++) {\n      const t2 = i / rows;\n      // taper width: wider at base (inside arch), narrower at top\n      const w = 6 - 3 * t2;\n      // axial position along BRANCH 3 (slants up-right)\n      const cx = 198 + 12 * t2;\n      const cy = 66 - 42 * t2;\n      // perpendicular to slope direction (slope ~ (12, -42), normalize)\n      const slope = Math.atan2(-42, 12);\n      const px = -Math.sin(slope) * w;\n      const py = Math.cos(slope) * w;\n      path += `\u003Cline x1=\"${cx-px}\" y1=\"${cy-py}\" x2=\"${cx+px}\" y2=\"${cy+py}\"/>`;\n      if (i \u003C rows) {\n        const t3 = (i + 1) / rows;\n        const w2 = 6 - 3 * t3;\n        const cx2 = 198 + 12 * t3;\n        const cy2 = 66 - 42 * t3;\n        const px2 = -Math.sin(slope) * w2;\n        const py2 = Math.cos(slope) * w2;\n        path += `\u003Cline x1=\"${cx-px}\" y1=\"${cy-py}\" x2=\"${cx2+px2}\" y2=\"${cy2+py2}\"/>`;\n        path += `\u003Cline x1=\"${cx+px}\" y1=\"${cy+py}\" x2=\"${cx2-px2}\" y2=\"${cy2-py2}\"/>`;\n      }\n    }\n    t.innerHTML = `\n      \u003Csvg viewBox=\"0 0 320 200\" preserveAspectRatio=\"xMidYMid meet\" style=\"width:100%;height:100%;\">\n        \u003C!-- curved pathway -->\n        \u003Cg fill=\"none\" stroke=\"rgba(232,240,248,0.78)\" stroke-width=\"1.5\">\n          \u003Cpath d=\"M 60 180 Q 60 80, 160 60 Q 260 80, 260 180\" />\n          \u003Cpath d=\"M 80 180 Q 80 95, 160 78 Q 240 95, 240 180\" />\n        \u003C/g>\n        \u003C!-- branch pathways -->\n        \u003Cg fill=\"none\" stroke=\"rgba(232,240,248,0.78)\" stroke-width=\"1.5\">\n          \u003C!-- branch pathway -->\n          \u003Cpath d=\"M 122 66 L 110 22\" />\n          \u003Cpath d=\"M 132 70 L 124 22\" />\n          \u003C!-- BRANCH 2 (left common carotid) -->\n          \u003Cpath d=\"M 156 60 L 154 18\" />\n          \u003Cpath d=\"M 166 60 L 168 18\" />\n          \u003C!-- BRANCH 3 (left subclavian) -->\n          \u003Cpath d=\"M 192 64 L 204 22\" />\n          \u003Cpath d=\"M 200 68 L 214 26\" />\n        \u003C/g>\n        \u003C!-- structure placement: inside BRANCH 2 and BRANCH 3 -->\n        \u003Cg stroke=\"rgba(232,240,248,0.96)\" stroke-width=\"0.8\" fill=\"none\">\n          ${path}\n        \u003C/g>\n        \u003C!-- second structure visualisation (inside BRANCH 2) -->\n        \u003Cg stroke=\"rgba(232,240,248,0.96)\" stroke-width=\"0.8\" fill=\"none\">\n          \u003Cline x1=\"159\" y1=\"56\" x2=\"163\" y2=\"56\"/>\n          \u003Cline x1=\"158\" y1=\"50\" x2=\"164\" y2=\"50\"/>\n          \u003Cline x1=\"157\" y1=\"44\" x2=\"165\" y2=\"44\"/>\n          \u003Cline x1=\"156\" y1=\"38\" x2=\"166\" y2=\"38\"/>\n          \u003Cline x1=\"155\" y1=\"32\" x2=\"167\" y2=\"32\"/>\n          \u003Cline x1=\"154\" y1=\"26\" x2=\"168\" y2=\"26\"/>\n          \u003Cline x1=\"159\" y1=\"56\" x2=\"158\" y2=\"50\"/>\n          \u003Cline x1=\"163\" y1=\"56\" x2=\"164\" y2=\"50\"/>\n          \u003Cline x1=\"158\" y1=\"50\" x2=\"157\" y2=\"44\"/>\n          \u003Cline x1=\"164\" y1=\"50\" x2=\"165\" y2=\"44\"/>\n          \u003Cline x1=\"157\" y1=\"44\" x2=\"156\" y2=\"38\"/>\n          \u003Cline x1=\"165\" y1=\"44\" x2=\"166\" y2=\"38\"/>\n          \u003Cline x1=\"156\" y1=\"38\" x2=\"155\" y2=\"32\"/>\n          \u003Cline x1=\"166\" y1=\"38\" x2=\"167\" y2=\"32\"/>\n          \u003Cline x1=\"155\" y1=\"32\" x2=\"154\" y2=\"26\"/>\n          \u003Cline x1=\"167\" y1=\"32\" x2=\"168\" y2=\"26\"/>\n        \u003C/g>\n        \u003C!-- callouts -->\n        \u003Cg font-family=\"JetBrains Mono, monospace\" font-size=\"6.5\" fill=\"rgba(232,240,248,0.62)\" letter-spacing=\"1\">\n          \u003C!-- CURVED DESIGN PATH -->\n          \u003Cline x1=\"95\" y1=\"160\" x2=\"40\" y2=\"175\" stroke=\"rgba(232,240,248,0.34)\" stroke-width=\"0.5\" stroke-dasharray=\"2 2\"/>\n          \u003Ctext x=\"6\" y=\"185\">CURVED PATH\u003C/text>\n          \u003C!-- BRANCH 1 -->\n          \u003Cline x1=\"117\" y1=\"40\" x2=\"60\" y2=\"22\" stroke=\"rgba(232,240,248,0.34)\" stroke-width=\"0.5\" stroke-dasharray=\"2 2\"/>\n          \u003Ctext x=\"6\" y=\"20\">BRANCH 1\u003C/text>\n          \u003C!-- BRANCH 2 -->\n          \u003Cline x1=\"161\" y1=\"24\" x2=\"161\" y2=\"10\" stroke=\"rgba(232,240,248,0.34)\" stroke-width=\"0.5\" stroke-dasharray=\"2 2\"/>\n          \u003Ctext x=\"148\" y=\"8\">BRANCH 2\u003C/text>\n          \u003C!-- BRANCH 3 -->\n          \u003Cline x1=\"210\" y1=\"30\" x2=\"262\" y2=\"22\" stroke=\"rgba(232,240,248,0.34)\" stroke-width=\"0.5\" stroke-dasharray=\"2 2\"/>\n          \u003Ctext x=\"264\" y=\"20\">BRANCH 3\u003C/text>\n          \u003C!-- STRUCTURE PLACEMENT -->\n          \u003Cline x1=\"205\" y1=\"50\" x2=\"275\" y2=\"75\" stroke=\"rgba(232,240,248,0.34)\" stroke-width=\"0.5\" stroke-dasharray=\"2 2\"/>\n          \u003Ctext x=\"245\" y=\"85\">STRUCTURE PLACEMENT\u003C/text>\n        \u003C/g>\n      \u003C/svg>`;\n  }\n\n  // ─── Scene 3 ───\n  function scene3() {\n    const t = document.getElementById('s3-mandrel');\n    if (!t) return;\n    const stop = SE.renderRotatingStructure(t, { pinsAround: 20, rows: 10, r1: 8, r2: 14, height: 40 });\n    activeStops.push(stop);\n  }\n\n  // ─── Scene 4 ───\n  function scene4() {\n    const a = document.getElementById('s4-cyl');\n    const b = document.getElementById('s4-cone');\n    if (!a || !b) return;\n    const s1 = SE.renderRotatingStructure(a, { pinsAround: 14, rows: 7, r1: 11, r2: 11, height: 40 });\n    const s2 = SE.renderRotatingStructure(b, { pinsAround: 14, rows: 7, r1: 7, r2: 14, height: 40 });\n    activeStops.push(s1, s2);\n  }\n\n  // ─── Scene 5 ───\n  function scene5() {\n    const t = document.getElementById('s5-grid');\n    if (!t) return;\n    const stop = SE.renderRotatingStructure(t, { pinsAround: 24, rows: 12, r1: 8, r2: 14, height: 40 });\n    activeStops.push(stop);\n    const el = document.getElementById('recalc-num');\n    if (!el) return;\n    const target = 2124;\n    const start = performance.now();\n    const dur = 2200;\n    let raf;\n    function tick(now) {\n      const t2 = Math.min(1, (now - start) / dur);\n      const eased = 1 - Math.pow(1 - t2, 3);\n      el.textContent = Math.floor(eased * target).toLocaleString();\n      if (t2 \u003C 1) raf = requestAnimationFrame(tick);\n    }\n    raf = requestAnimationFrame(tick);\n    activeStops.push(() => cancelAnimationFrame(raf));\n  }\n\n  // ─── Scene 6 ───\n  function scene6() {\n    const t = document.getElementById('s6-variants');\n    if (!t) return;\n    const variants = [\n      [7, 12, 36], [8, 14, 40], [9, 16, 44],\n      [6, 13, 38], [10, 15, 42], [7, 14, 46],\n    ];\n    let html = '\u003Cdiv style=\"display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:14px;height:100%;padding:32px;\">';\n    for (let i = 0; i \u003C 6; i++) {\n      html += `\u003Cdiv style=\"border:1px solid var(--line-1);position:relative;display:flex;align-items:center;justify-content:center;\">\n        \u003Cdiv style=\"position:absolute;top:10px;left:14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-3);letter-spacing:0.16em;\">VAR-${String(i+1).padStart(2,'0')}\u003C/div>\n        \u003Cdiv style=\"position:absolute;bottom:10px;right:14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);\">r₁ ${variants[i][0]} · r₂ ${variants[i][1]} · H ${variants[i][2]}\u003C/div>\n        \u003Cdiv id=\"s6-structure-${i}\" style=\"width:80%;height:80%;\">\u003C/div>\n      \u003C/div>`;\n    }\n    html += '\u003C/div>';\n    t.innerHTML = html;\n    variants.forEach((v, i) => {\n      const s = SE.renderRotatingStructure(document.getElementById(`s6-structure-${i}`), {\n        pinsAround: 12, rows: 6, r1: v[0], r2: v[1], height: v[2], rotation: -16 + i * 4,\n      });\n      activeStops.push(s);\n    });\n  }\n\n  // ─── Scene 7: Theatre prompt + AI response ───\n  function scene7() {\n    const t = document.getElementById('theatre-7');\n    if (!t) return;\n    t.innerHTML = `\n      \u003Cdiv class=\"window\" style=\"left: 4%; top: 6%; width: 44%; height: 88%;\">\n        \u003Cdiv class=\"window-bar\">\n          \u003Cdiv class=\"window-dots\">\u003Cspan>\u003C/span>\u003Cspan>\u003C/span>\u003Cspan>\u003C/span>\u003C/div>\n          \u003Cdiv class=\"window-title\">Engineer · Prompt Builder\u003C/div>\n        \u003C/div>\n        \u003Cdiv class=\"window-body\">\n          \u003Cdiv style=\"font-family:Manrope,sans-serif;font-size:14px;color:var(--ink-3);letter-spacing:0.18em;text-transform:uppercase;margin-bottom:18px;\">Ask\u003C/div>\n          \u003Cdiv id=\"s7-typed\" style=\"font-family:Manrope,sans-serif;font-size:20px;color:var(--ink-0);line-height:1.55;\">\u003C/div>\n        \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"window\" style=\"left: 52%; top: 6%; width: 44%; height: 88%;\">\n        \u003Cdiv class=\"window-bar\">\n          \u003Cdiv class=\"window-dots\">\u003Cspan>\u003C/span>\u003Cspan>\u003C/span>\u003Cspan>\u003C/span>\u003C/div>\n          \u003Cdiv class=\"window-title\">AI Assistant · Generating...\u003C/div>\n        \u003C/div>\n        \u003Cdiv class=\"window-body scroll\" id=\"s7-response\">\n          \u003Cdiv style=\"color:var(--ink-3);font-style:italic;font-size:18px;\">Awaiting prompt&hellip;\u003C/div>\n        \u003C/div>\n      \u003C/div>\n      \u003Csvg style=\"position:absolute;left:48%;top:50%;width:4%;height:40px;transform:translateY(-50%);overflow:visible;pointer-events:none;\">\n        \u003Cline x1=\"0%\" y1=\"50%\" x2=\"100%\" y2=\"50%\" stroke=\"var(--ink-2)\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/>\n        \u003Ctext x=\"50%\" y=\"-2\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"11\" fill=\"var(--ink-2)\" lett ono',monospace;font-size:13px;color:var(--ink-3);letter-spacing:0.18em;text-transform:uppercase;margin-bottom:14px;\">Live Position\u003C/div>\n            \u003Cdiv class=\"readout\" id=\"s11-readout\">\n              \u003Cb>X\u003C/b>\u003Cspan id=\"s11-x\">0.000 mm\u003C/span>\n              \u003Cb>Y\u003C/b>\u003Cspan id=\"s11-y\">0.000 mm\u003C/span>\n              \u003Cb>Z\u003C/b>\u003Cspan id=\"s11-z\">0.000 mm\u003C/span>\n              \u003Cb>θ\u003C/b>\u003Cspan id=\"s11-th\">0.0°\u003C/span>\n            \u003C/div>\n          \u003C/div>\n        \u003C/div>\n        \u003Cdiv style=\"position:relative;overflow:hidden;\">\n          \u003Cdiv id=\"s11-structure\" style=\"position:absolute;inset:0;\">\u003C/div>\n          \u003Cdiv style=\"position:absolute;left:32px;right:32px;bottom:24px;height:2px;background:var(--line-1);\">\n            \u003Cdiv id=\"s11-progress-fill\" style=\"height:100%;width:0%;background:var(--ink-0);transition:width 0.2s linear;\">\u003C/div>\n          \u003C/div>\n        \u003C/div>\n      \u003C/div>\n    `;\n    const opts = { pinsAround: 20, rows: 10, r1: 8, r2: 14, height: 40 };\n    const { pins } = SE.buildPins(opts);\n    const structureHost = t.querySelector('#s11-structure');\n    const svg = document.createElementNS(NS, 'svg');\n    svg.setAttribute('class', 'structure-svg');\n    svg.setAttribute('viewBox', '-30 -30 60 60');\n    structureHost.appendChild(svg);\n    const rotY = (-20 * Math.PI) / 180;\n    const projected = pins.map(p => ({ ref: p, ...SE.project(p.x, p.y, p.z, { tiltX: 0.22, scale: 1, rotY }) }));\n    const mandrelG = document.createElementNS(NS, 'g');\n    for (let i = 0; i \u003C 8; i++) {\n      const ang = (i / 8) * Math.PI * 2;\n      const x1 = opts.r1 * Math.cos(ang), z1 = opts.r1 * Math.sin(ang);\n      const x2 = opts.r2 * Math.cos(ang), z2 = opts.r2 * Math.sin(ang);\n      const p1 = SE.project(x1, -opts.height / 2, z1, { tiltX: 0.22, scale: 1, rotY });\n      const p2 = SE.project(x2,  opts.height / 2, z2, { tiltX: 0.22, scale: 1, rotY });\n      const ln = document.createElementNS(NS, 'line');\n      ln.setAttribute('x1', p1.x); ln.setAttribute('y1', p1.y);\n      ln.setAttribute('x2', p2.x); ln.setAttribute('y2', p2.y);\n      ln.setAttribute('class', 'strut-back');\n      mandrelG.appendChild(ln);\n    }\n    svg.appendChild(mandrelG);\n    const wireG = document.createElementNS(NS, 'g'); svg.appendChild(wireG);\n    const pinG = document.createElementNS(NS, 'g'); svg.appendChild(pinG);\n    const head = document.createElementNS(NS, 'circle');\n    head.setAttribute('r', '1.4');\n    head.setAttribute('fill', 'var(--ink-0)');\n    head.setAttribute('stroke', 'var(--ink-2)');\n    head.setAttribute('stroke-width', '0.4');\n    svg.appendChild(head);\n    head.style.display = 'none';\n\n    const items = t.querySelectorAll('#s11-checklist li');\n    let cancel = false;\n    activeStops.push(() => { cancel = true; });\n\n    setTimeout(() => { if (!cancel) items[0].classList.add('done'); }, 200);\n    setTimeout(() => { if (!cancel) items[1].classList.add('done'); }, 600);\n    setTimeout(() => { if (!cancel) items[2].classList.add('done'); }, 1000);\n    setTimeout(() => {\n      if (cancel) return;\n      items[3].classList.add('done');\n      head.style.display = '';\n      weave();\n    }, 1400);\n\n    function weave() {\n      let prev = null;\n      const order = projected.slice().sort((a, b) => {\n        if (a.ref.row !== b.ref.row) return a.ref.row - b.ref.row;\n        return a.ref.col - b.ref.col;\n      });\n      let k = 0;\n      function tick() {\n        if (cancel) return;\n        if (k >= order.length) {\n          items[4].classList.add('done');\n          head.style.display = 'none';\n          return;\n        }\n        const p = order[k];\n        const dot = document.createElementNS(NS, 'circle');\n        dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y);\n        dot.setAttribute('r', p.depth >= 0 ? 0.6 : 0.4);\n        dot.setAttribute('class', p.depth >= 0 ? 'pin' : 'pin-back');\n        pinG.appendChild(dot);\n        if (prev) {\n          const ln = document.createElementNS(NS, 'line');\n          ln.setAttribute('x1', prev.x); ln.setAttribute('y1', prev.y);\n          ln.setAttribute('x2', p.x); ln.setAttribute('y2', p.y);\n          const isBack = (prev.depth + p.depth) / 2 \u003C 0;\n          ln.setAttribute('class', isBack ? 'strut-back' : 'strut');\n          wireG.appendChild(ln);\n        }\n        prev = p;\n        head.setAttribute('cx', p.x); head.setAttribute('cy', p.y);\n        document.getElementById('s11-x').textContent = p.ref.x.toFixed(3) + ' mm';\n        document.getElementById('s11-y').textContent = p.ref.y.toFixed(3) + ' mm';\n        document.getElementById('s11-z').textContent = p.ref.z.toFixed(3) + ' mm';\n        document.getElementById('s11-th').textContent = (p.ref.theta * 180 / Math.PI).toFixed(1) + '°';\n        const coordEl = document.getElementById('s11-coord');\n        if (coordEl) coordEl.textContent = `X ${p.ref.x.toFixed(2)} · Y ${p.ref.y.toFixed(2)} · Z ${p.ref.z.toFixed(2)}`;\n        document.getElementById('s11-progress-fill').style.width = ((k + 1) / order.length * 100) + '%';\n        k++;\n        setTimeout(tick, 22);\n      }\n      tick();\n    }\n  }\n\n  // ─── Scene 12 ───\n  function scene12() {\n    const t = document.getElementById('s12-structure');\n    if (!t) return;\n    const stop = SE.renderRotatingStructure(t, { pinsAround: 22, rows: 11, r1: 8, r2: 14, height: 40 });\n    activeStops.push(stop);\n  }\n\n  const SCENES = {\n    '1': scene1, '2': scene2, '3': scene3, '4': scene4, '5': scene5,\n    '6': scene6, '7': scene7, '8': scene8, '9': scene9, '10': scene10,\n    '11': scene11, '12': scene12,\n  };\n\n  // Scene 13 + outro have static visuals only — no scene fn\n\n  // ─── Wire up deck-stage events + autoplay + controls ───\n  const deck = document.querySelector('deck-stage');\n  if (!deck) return;\n\n  function runScene(slideEl) {\n    cleanup();\n    if (!slideEl) return;\n    const sceneId = slideEl.dataset.scene;\n    if (sceneId && SCENES[sceneId]) {\n      try { SCENES[sceneId](); } catch (e) { console.error('scene err', sceneId, e); }\n    }\n  }\n\n  deck.addEventListener('slidechange', (e) => {\n    runScene(e.detail.slide);\n    updateChrome(e.detail.index, e.detail.total);\n  });\n\n  // ─── Autoplay ───\n  // dwell times per slide (seconds). Cover & most scenes get 6s; theatres get more.\n  const DWELL = {\n    cover: 20,\n    '1': 20, '2': 20, '3': 20, '4': 20, '5': 20, '6': 20,\n    '7': 20,\n    '8': 20,\n    '9': 20,\n    '10': 20,\n    '11': 20,\n    '12': 20,\n    '13': 20,\n    'outro': 20,\n  };\n\n  let autoplay = false;\n  let timer = null;\n  let autoplayProgressRaf = null;\n  const playIcon = document.getElementById('ctl-play-icon');\n  const indicator = document.getElementById('autoplay-indicator');\n  const progFill = document.getElementById('ctl-progress-fill');\n\n  function setAutoplay(on) {\n    autoplay = on;\n    if (on) {\n      playIcon.outerHTML = '\u003Csvg id=\"ctl-play-icon\" viewBox=\"0 0 24 24\" fill=\"currentColor\">\u003Cpath d=\"M6 5h4v14H6zM14 5h4v14h-4z\"/>\u003C/svg>';\n      indicator.classList.add('active');\n      scheduleNext();\n    } else {\n      const i = document.getElementById('ctl-play-icon');\n      i.outerHTML = '\u003Csvg id=\"ctl-play-icon\" viewBox=\"0 0 24 24\" fill=\"currentColor\">\u003Cpath d=\"M8 5v14l11-7z\"/>\u003C/svg>';\n      indicator.classList.remove('active');\n      if (timer) { clearTimeout(timer); timer = null; }\n      if (autoplayProgressRaf) cancelAnimationFrame(autoplayProgressRaf);\n      progFill.style.width = '0%';\n    }\n  }\n\n  function scheduleNext() {\n    if (timer) clearTimeout(timer);\n    if (autoplayProgressRaf) cancelAnimationFrame(autoplayProgressRaf);\n    if (!autoplay) return;\n    const slides = deck.querySelectorAll(':scope > section');\n    const cur = (typeof deck.index === 'number') ? deck.index : 0;\n    const slide = slides[cur];\n    const sceneId = slide && slide.dataset.scene;\n    const label = slide && slide.dataset.label || '';\n    const key = sceneId || (label.toLowerCase().includes('cover') ? 'cover' : 'outro');\n    const dwellSec = DWELL[key] || 7;\n    const dwellMs = dwellSec * 1000;\n    const start = performance.now();\n    function progressTick(now) {\n      const t = Math.min(1, (now - start) / dwellMs);\n      progFill.style.width = (t * 100) + '%';\n      if (t \u003C 1 && autoplay) autoplayProgressRaf = requestAnimationFrame(progressTick);\n    }\n    autoplayProgressRaf = requestAnimationFrame(progressTick);\n    timer = setTimeout(() => {\n      if (!autoplay) return;\n      const slidesNow = deck.querySelectorAll(':scope > section');\n      const nextIdx = ((typeof deck.index === 'number') ? deck.index : 0) + 1;\n      if (nextIdx >= slidesNow.length) {\n        // loop to start\n        deck.goTo(0);\n      } else {\n        deck.goTo(nextIdx);\n      }\n    }, dwellMs);\n  }\n\n  // ─── Buttons ───\n  document.getElementById('ctl-prev').addEventListener('click', (e) => {\n    e.preventDefault(); e.stopPropagation();\n    setAutoplay(false);\n    if (typeof deck.prev === 'function') deck.prev();\n    else { const cur = (typeof deck.index === 'number') ? deck.index : 0; if (cur > 0) deck.goTo(cur - 1); }\n  });\n  document.getElementById('ctl-next').addEventListener('click', (e) => {\n    e.preventDefault(); e.stopPropagation();\n    setAutoplay(false);\n    if (typeof deck.next === 'function') deck.next();\n    else {\n      const slides = deck.querySelectorAll(':scope > section');\n      const cur = (typeof deck.index === 'number') ? deck.index : 0;\n      if (cur \u003C slides.length - 1) deck.goTo(cur + 1);\n    }\n  });\n  document.getElementById('ctl-play').addEventListener('click', () => setAutoplay(!autoplay));\n\n  document.addEventListener('click', (e) => {\n    if (e.target.closest && e.target.closest('.controls, .hint, .crumb-dot, .progress-dot, [data-slide-index]')) return;\n    setAutoplay(!autoplay);\n  }, true);\n\n  // Space/click toggles autoplay. Arrow keys switch to manual navigation.\n  window.addEventListener('keydown', (e) => {\n    if (e.target.matches('input, textarea, select, [contenteditable=\"true\"]')) return;\n    if (e.code === 'Space') {\n      e.preventDefault();\n      e.stopPropagation();\n      setAutoplay(!autoplay);\n    } else if (e.code === 'ArrowRight' || e.key === 'ArrowRight') {\n      e.preventDefault();\n      e.stopPropagation();\n      setAutoplay(false);\n      if (typeof deck.next === 'function') deck.next();\n      else {\n        const slides = deck.querySelectorAll(':scope > section');\n        const cur = (typeof deck.index === 'number') ? deck.index : 0;\n        if (cur \u003C slides.length - 1) deck.goTo(cur + 1);\n      }\n    } else if (e.code === 'ArrowLeft' || e.key === 'ArrowLeft') {\n      e.preventDefault();\n      e.stopPropagation();\n      setAutoplay(false);\n      if (typeof deck.prev === 'function') deck.prev();\n      else {\n        const cur = (typeof deck.index === 'number') ? deck.index : 0;\n        if (cur > 0) deck.goTo(cur - 1);\n      }\n    }\n  }, true);\n\n  function updateChrome(idx, total) {\n    const counter = document.getElementById('ctl-counter');\n    counter.textContent = String(idx + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0');\n    const slides = deck.querySelectorAll(':scope > section');\n    document.getElementById('ctl-prev').disabled = idx === 0;\n    document.getElementById('ctl-next').disabled = idx === (deck.length || slides.length) - 1;\n    if (autoplay) scheduleNext();\n  }\n\n  // hide hint after first interaction\n  let hintHidden = false;\n  function hideHint() {\n    if (hintHidden) return;\n    hintHidden = true;\n    const h = document.getElementById('hint');\n    if (h) { h.style.opacity = '0'; setTimeout(() => h.remove(), 600); }\n  }\n  ['click', 'keydown'].forEach(ev => window.addEventListener(ev, hideHint, { once: true }));\n  setTimeout(hideHint, 8000);\n\n  // initial render\n  setTimeout(() => {\n    const slides = deck.querySelectorAll(':scope > section');\n    const cur = (typeof deck.index === 'number') ? deck.index : 0;\n    runScene(slides[cur]);\n    updateChrome(cur, slides.length);\n    setAutoplay(true);\n  }, 50);\n})();\n\u003C/script>\n\n\n\n\u003C/div>\n\u003C/body>\u003C/html>"</script>
