    /* ============================================================
       PARAMIS 404: "Stoop" design system v1

    :root {
      --ink: #0E0E0F;

      --bone: #ECE8E0;
      --bone-dim: #8E897D;

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* the falcon, missing its mark for once */

      width: clamp(280px, 34vw, 520px);
      opacity: 0.16; z-index: 0; pointer-events: none;
    }
    /* the one diagonal */
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: var(--steel);
      clip-path: polygon(0 calc(100% - 12vw), 100% calc(100% - 4vw), 100% 100%, 0 100%);

    .wrap { position: relative; z-index: 1; text-align: center; max-width: 680px; }

      font-size: clamp(1.2rem, 3.6vw, 1.9rem);

      margin: 1.2rem 0 0.8rem;

    p.lead {

      color: var(--bone-dim);
      font-size: 1.02rem;
      max-width: 44ch;
      margin: 0 auto 2.6rem;
    }
    .links { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    .links a {
      display: inline-block;
      padding: 0.95em 1.7em;
      text-decoration: none;
      font-stretch: 115%; font-weight: 700; font-size: 0.66rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }
    .links a.primary { background: var(--gold); color: var(--ink); }
    .links a.primary:hover, .links a.primary:focus-visible { background: var(--bone); }
    .links a.ghost { color: var(--bone); border: 1px solid var(--hair); }
    .links a.ghost:hover, .links a.ghost:focus-visible { border-color: var(--gold); color: var(--gold); }
    footer {

      text-align: center; z-index: 1;

      color: var(--bone-dim); font-size: 0.8rem;
