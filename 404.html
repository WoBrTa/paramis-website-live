<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Paramis | Page Not Found</title>
  <meta name="description" content="That page could not be found. Find your way back to Paramis AI.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4A90A4;
      --primary-light: #7CB9E8;
      --accent: #F5A623;
      --dark: #0a0a0a;
      --light: #ffffff;
      --gray: #a0a0a0;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--dark);
      color: var(--light);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
      position: relative;
    }
    /* Ambient glow */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(600px circle at 20% 20%, rgba(74, 144, 164, 0.10), transparent 60%),
        radial-gradient(500px circle at 80% 80%, rgba(245, 166, 35, 0.07), transparent 60%);
    }
    .wrap {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 640px;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 2rem;
      opacity: 0.95;
      filter: drop-shadow(0 0 24px rgba(74, 144, 164, 0.35));
    }
    .code {
      font-size: clamp(4.5rem, 18vw, 9rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(90deg, var(--primary-light), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 600;
      margin: 1rem 0 0.75rem;
      letter-spacing: -0.01em;
    }
    p.lead {
      color: var(--gray);
      font-size: 1.05rem;
      max-width: 460px;
      margin: 0 auto 2.5rem;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    .links a {
      display: inline-block;
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .links a.primary {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      color: #0a0a0a;
      font-weight: 600;
    }
    .links a.ghost {
      color: var(--light);
      background: var(--glass);
      border: 1px solid var(--glass-border);
    }
    .links a:hover { transform: translateY(-2px); }
    .links a.ghost:hover { border-color: rgba(124, 185, 232, 0.5); }
    footer {
      position: fixed;
      bottom: 1.25rem;
      left: 0;
      width: 100%;
      text-align: center;
      color: #666;
      font-size: 0.8rem;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/peregrine-logo.png" alt="Paramis" class="logo">
    <div class="code">404</div>
    <h1>This page isn't here.</h1>
    <p class="lead">The link may be old, or the page may have moved. Here's the way back.</p>
    <div class="links">
      <a href="/" class="primary">Home</a>
      <a href="/field-notes.html" class="ghost">Field Notes</a>
      <a href="/safety-guide/" class="ghost">Safety Guide</a>
      <a href="/#contact" class="ghost">Contact</a>
    </div>
  </div>
  <footer><span>&copy; 2026 Paramis LLC. All rights reserved.</span></footer>
</body>
</html>
